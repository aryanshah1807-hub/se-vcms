services:
  db:
    image: postgres:16
    container_name: vcms-db
    environment:
      POSTGRES_USER: vcms
      POSTGRES_PASSWORD: vcms_pass
      POSTGRES_DB: vcms
    ports: ["5432:5432"]
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # runs 01_schema.sql then 02_seed.sql on first start
      - vcms_data:/var/lib/postgresql/data
volumes:
  vcms_data:
